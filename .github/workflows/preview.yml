name: Preview

on:
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build preview (Android)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: eas build --local --platform android --profile preview --non-interactive --output finale-preview.apk

      - name: Publish the preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview finale-preview.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Finale preview" \
            --notes "Built from $(git log -1 --format='%h: %s')"
